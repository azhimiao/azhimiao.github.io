<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#e9f4fb"/></linearGradient></defs><rect width="1400" height="900" rx="52" fill="url(#b)"/><text x="100" y="130" font-size="27" font-family="Arial,sans-serif" fill="#748c9d">REAL-WORLD CONTEXT</text><text x="100" y="225" font-size="58" font-family="Georgia,serif" fill="#0b263f">You decide what they can see.</text><text x="100" y="282" font-size="25" font-family="Arial,sans-serif" fill="#617c8f">Open each one on its own. Close it whenever you want.</text><circle cx="980" cy="440" r="260" fill="#ffffff" stroke="#d7eaf4" stroke-width="2"/><circle cx="980" cy="440" r="190" fill="none" stroke="#b9deef" stroke-width="2"/><circle cx="980" cy="440" r="115" fill="#0d2d47"/><path d="M945 412a55 55 0 1 1 46 88 43 43 0 1 0-46-88Z" fill="#e6faff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(980 118)"><circle r="62" fill="#fff" stroke="#9eddf4"/><text y="8" font-size="22" fill="#25475d">Voice</text></g><g transform="translate(1260 280)"><circle r="62" fill="#fff" stroke="#9eddf4"/><text y="8" font-size="22" fill="#25475d">Camera</text></g><g transform="translate(1280 590)"><circle r="62" fill="#fff" stroke="#9eddf4"/><text y="8" font-size="22" fill="#25475d">Screen</text></g><g transform="translate(980 760)"><circle r="62" fill="#fff" stroke="#9eddf4"/><text y="8" font-size="22" fill="#25475d">Location</text></g><g transform="translate(700 590)"><circle r="62" fill="#fff" stroke="#9eddf4"/><text y="8" font-size="22" fill="#25475d">Calendar</text></g></g><g transform="translate(100 390)" font-family="Arial,sans-serif"><rect width="470" height="280" rx="30" fill="#0d2a43"/><text x="40" y="70" font-size="25" fill="#e8f8ff">Every sense is separate</text><text x="40" y="122" font-size="21" fill="#9ebfd2">Voice can be on while screen stays off.</text><text x="40" y="160" font-size="21" fill="#9ebfd2">Location can stay approximate.</text><text x="40" y="198" font-size="21" fill="#9ebfd2">Screen capture stays session-based.</text><rect x="40" y="230" width="250" height="4" rx="2" fill="#31bbe6"/></g></svg>
