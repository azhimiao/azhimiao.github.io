<g transform="translate(100 390)" font-family="PingFang SC,sans-serif"><rect width="470" height="280" rx="30" fill="#0d2a43"/><text x="40" y="70" font-size="25" fill="#e8f8ff">每一种感知，单独授权</text><text x="40" y="122" font-size="21" fill="#9ebfd2">语音可以开，屏幕可以关。</text><text x="40" y="160" font-size="21" fill="#9ebfd2">定位可以只给大致位置。</text><text x="40" y="198" font-size="21" fill="#9ebfd2">截屏按会话授权，不做永久偷偷捕获。</text><rect x="40" y="230" width="250" height="4" rx="2" fill="#31bbe6"/></g></svg>
