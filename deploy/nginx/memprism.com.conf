# Apex — certificate not yet issued; bootstrap on :80 then certbot --nginx
server {
    listen 80;
    listen [::]:80;
    server_name memprism.com www.memprism.com;

    root /var/www/memprism.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Convenience: send APK seekers to the download host
    location = /nyra-latest.apk {
        return 302 https://download.memprism.com/nyra-latest.apk;
    }

    location = /download {
        return 302 https://download.memprism.com/;
    }

    location = /legal {
        return 302 https://download.memprism.com/legal/;
    }

    location = /legal/ {
        return 302 https://download.memprism.com/legal/;
    }
}
