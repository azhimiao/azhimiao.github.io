# HTTP bootstrap (certbot will upgrade to HTTPS + redirect)
server {
    listen 80;
    listen [::]:80;
    server_name download.memprism.com;

    # Large APK; no artificial rate limiting (product decision: ignore concurrency).
    client_max_body_size 200m;

    root /var/www/download.memprism.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /nyra-latest.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="nyra-latest.apk"';
        add_header Cache-Control "public, max-age=300";
        add_header X-Download-Channel "memprism-web";
    }

    location /legal/ {
        try_files $uri $uri/ /legal/index.html;
    }

    # Optional helper process (uncomment if using systemd on :8791 instead of root)
    # location / {
    #     proxy_pass http://127.0.0.1:8791;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
