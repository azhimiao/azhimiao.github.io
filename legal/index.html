const DATA={"zh-CN":{"important":{"label":"重要条款提示","html":"<h1>Nyra（月栖）重要条款提示</h1>\n<p><strong>版本：0.2.0</strong></p>\n<p>在注册、下载、购买或首次启用相关功能前，请特别注意：</p>\n<ol>\n<li><strong>Nyra 是实验性、本地优先、部分开源的软件。</strong> 免费、本地、开源、Beta/Preview 功能通常按“现状”提供，可能存在错误、兼容问题、功能变化或停止维护。</li>\n<li><strong>我们不默认提供 SLA 或人工售后服务。</strong> 购买会员、Billing Credit、数字功能或虚拟物品，除购买页另有说明，不等于购买人工客服、定制、远程修复或长期维护。</li>\n<li><strong>重要本地数据请自行备份。</strong> 未明确显示“已同步/已备份”的本地聊天、记忆、角色、媒体或其他数据，可能因卸载、清数据、设备故障或误操作丢失，我们不承诺能够恢复从未上传的数据。</li>\n<li><strong>第三方模型和 BYOK 风险由第三方规则共同决定。</strong> 第三方直接扣费、封禁、限流、价格变化和数据处理不完全由 Nyra 控制。</li>\n<li><strong>数字权益交付/消费后的退款受到限制。</strong> 已消费 Billing Credit、已下载/激活的软件或数字功能、已完成的生成任务、已使用的虚拟物品原则上不支持仅因主观不满意而退款；法律或渠道强制要求的退款除外。</li>\n<li><strong>AI 输出不保证准确、稳定或符合偏好。</strong> 角色人格、记忆和输出可能随模型、版本和上下文变化。</li>\n<li><strong>功能和兼容性可能变化。</strong> 我们可以停止旧版本维护、替换模型、调整功能和未来价格；已经购买但尚未履行的权益按订单和法律处理。</li>\n<li><strong>责任限制。</strong> 在法律允许范围内，免费/本地/实验功能的间接损失以及未自行备份导致的数据损失不属于我们承诺赔偿的范围；付费功能的合同责任上限按用户协议约定执行。法律明确不得免责的责任不受影响。</li>\n</ol>\n<p>如果您不同意上述风险和边界，请不要继续下载、安装、购买或启用相关功能。</p>\n"},"terms":{"label":"用户协议与软件许可","html":"<h1>Nyra（月栖）用户协议与软件许可条款</h1>\n<p><strong>文档编号：</strong> TOS<br />\n<strong>版本：</strong> 0.2.0<br />\n<strong>定位：</strong> 实验性、本地优先、部分开源的 AI 伴侣软件；可选云端能力单独提供。</p>\n<blockquote>\n<p><strong>重要条款提示</strong>：本协议包含与您有重大利害关系的条款，包括“实验性软件 / 按现状提供”“不提供 SLA 或人工售后承诺”“第三方模型与 BYOK 风险”“本地数据备份责任”“数字内容及计算资源退款限制”“服务与功能可变更或停止”“责任限制”等。注册、下载、启用付费功能或继续使用前，请结合《重要条款提示》阅读。法律规定不得排除或限制的权利不受本协议影响。</p>\n</blockquote>\n<h2>TOS-1 协议关系与接受</h2>\n<p>Nyra（月栖，以下简称“Nyra”）是一套以本地运行、可配置模型、角色记忆与拟人化交互为核心的软件产品。部分组件可能以开源许可证提供；部分功能可能由 Nyra 或第三方提供可选的在线接口、同步、模型、生成、账户或计费能力。</p>\n<p>您下载、安装、注册、访问、使用 Nyra，或购买、激活任何付费数字功能，即表示您同意本协议及与具体功能相关的政策。若您不同意，请不要下载、安装、注册、购买或继续使用相关功能。</p>\n<p>对于必须以单独确认方式提示的异常条款，我们将在注册、购买或首次启用相关能力时，以显著方式另行提示；该提示与本协议共同构成约定内容。</p>\n<h2>TOS-2 本地软件、开源组件与可选云端能力是不同层级</h2>\n<p>Nyra 的产品形态分为：</p>\n<ol>\n<li><strong>本地软件 / 客户端</strong>：用户自愿下载并在自己的设备上运行；</li>\n<li><strong>开源或可查看源码的组件</strong>：按其仓库中标明的具体开源许可证使用；</li>\n<li><strong>可选在线能力</strong>：例如账户、同步、托管接口、模型路由、生图、语音或其他计算能力；</li>\n<li><strong>第三方 / BYOK 能力</strong>：由用户选择第三方模型或提供自己的 API Key。</li>\n</ol>\n<p>开源代码的许可证条款优先适用于相应开源组件；本协议主要规范 Nyra 品牌产品、非开源组件、官方分发、账户、在线能力及付费数字资源。</p>\n<p><strong>“提供可下载软件”不等于承诺提供持续人工服务。</strong> 除具体购买页面明确说明外，下载或使用 Nyra 不包含人工部署、人工调试、远程维护、数据恢复、角色定制、长期兼容支持或指定响应时间。</p>\n<h2>TOS-3 实验性产品与“按现状”提供</h2>\n<p>Nyra 处于持续开发和迭代状态。AI 模型、角色行为、记忆策略、UI、数据结构、插件、接口、价格、可用地区和兼容性可能频繁变化。</p>\n<p>在适用法律允许的最大范围内，免费软件、本地组件、测试功能、预览功能、开源组件以及未明确承诺服务等级的能力均按“现状（AS IS）”和“可用状态（AS AVAILABLE）”提供。</p>\n<p>除我们在具体购买页面作出的明确书面承诺外，我们不保证：</p>\n<ul>\n<li>软件没有缺陷、错误、崩溃或兼容问题；</li>\n<li>某项功能、模型、角色或第三方接口永久存在；</li>\n<li>AI 输出准确、稳定、连续、一致或符合您的主观期待；</li>\n<li>角色人格、记忆、关系状态在模型或版本升级后完全不变；</li>\n<li>服务持续在线或达到某个可用率；</li>\n<li>所有设备、ROM、浏览器、模型、插件或 API 均可兼容；</li>\n<li>用户内容永不丢失；</li>\n<li>技术支持在特定时间内回复或解决问题。</li>\n</ul>\n<p>除另行购买明确写明 SLA 的企业级服务外，Nyra <strong>不提供服务等级协议（SLA）</strong>。</p>\n<h2>TOS-4 不构成人工客服、专业服务或结果承诺</h2>\n<p>Nyra 的会员、数字功能、Billing Credit、虚拟物品或其他付费项目，除购买页明确写明外，购买的是相应数字功能、访问资格或计算资源，<strong>不等于购买人工客服、人工陪伴、人工咨询、人工运维或结果保证</strong>。</p>\n<p>Nyra 及其 AI 角色不是医生、律师、证券顾问、心理治疗师或其他持牌专业人士。AI 输出仅用于交互和一般信息，不应被视为专业意见或现实世界结果承诺。</p>\n<h2>TOS-5 AI 角色不是自然人</h2>\n<p>Nyra 中的角色、人格、记忆、情绪表达、主动事件和关系状态均由软件、模型和数据结构生成或维护。角色可以被设计得具有持续人格和关系感，但并非真实自然人，也不具有独立法律人格、财产权或现实世界代理权限。</p>\n<p>角色表达的爱、承诺、礼物、转账、占有欲、争执、和解或其他情感行为属于产品交互的一部分，除非产品明确标示为真实交易，否则不产生现实世界的婚姻、赠与、债务、雇佣、代理或投资关系。</p>\n<h2>TOS-6 年龄资格</h2>\n<p>Nyra 的虚拟伴侣和拟人化亲密关系能力原则上仅向年满 18 周岁的用户开放。我们可以根据地区、商店政策、安全风险或法律要求采取年龄确认、验证或限制措施。</p>\n<p>您不得以虚假年龄、借用他人身份或其他方式绕过年龄限制。</p>\n<h2>TOS-7 账户与设备安全</h2>\n<p>您应合理保护账户、密码、API Key、设备解锁方式和第三方凭证。因您主动共享凭证、在不可信设备使用、安装未经审查的第三方修改版、泄露 API Key 或未采取合理安全措施造成的损失，由相应责任方依法承担。</p>\n<p>发现盗用、未知扣款或凭证泄露后，请及时更换凭证并通过官方渠道联系我们。</p>\n<h2>TOS-8 本地数据、备份与设备风险</h2>\n<p>Nyra 是本地优先产品。部分角色卡、记忆、钱包玩法状态、缓存、媒体、设置或其他数据可能仅存在于您的设备。</p>\n<p>除产品明确显示已成功同步或备份外，<strong>请不要假设任何本地数据已经由 Nyra 服务器备份。</strong> 卸载应用、清除浏览器/应用数据、更换设备、系统重置、磁盘故障、第三方清理工具、误操作、文件损坏或版本不兼容都可能导致本地数据不可恢复。</p>\n<p>对您认为重要的角色、聊天、日记、附件或其他本地资料，您应使用产品提供的导出/备份功能或自行保存副本。我们不承诺能够恢复从未上传到我们控制的服务器的数据。</p>\n<h2>TOS-9 用户内容与权限</h2>\n<p>您保留对您依法拥有的文本、图片、角色设定、音频、文件等用户内容的权利。为提供您主动使用的功能，您授予我们在必要范围内处理、传输、缓存、格式转换和展示相关内容的权限。</p>\n<p>您应确保自己有权提交相关内容，不得利用 Nyra 侵犯他人著作权、隐私权、肖像权、名誉权或其他合法权益。</p>\n<h2>TOS-10 AI 生成内容的风险</h2>\n<p>AI 可能产生错误、虚构、遗漏、冒犯、不一致或不符合预期的内容。模型输出具有概率性，相同输入也可能获得不同结果。</p>\n<p>您应在将生成内容用于公开发布、商业决策、医疗、法律、财务、安全或其他高影响场景之前自行核验。对于可识别为 AI 生成/合成的内容，应遵守产品标识要求及适用法律。</p>\n<h2>TOS-11 第三方模型、插件、BYOK 与外部费用</h2>\n<p>当您选择第三方模型、OpenRouter、火山引擎、其他 API 提供商、插件或 BYOK 时，相关请求可能直接或间接发送给第三方。第三方的：</p>\n<ul>\n<li>模型行为；</li>\n<li>内容政策；</li>\n<li>价格和扣费；</li>\n<li>限流、宕机和地区限制；</li>\n<li>账户封禁；</li>\n<li>数据保留与隐私处理；</li>\n<li>API Key 安全；</li>\n</ul>\n<p>受第三方自身规则影响，不完全由 Nyra 控制。</p>\n<p><strong>第三方直接向您账户收取的费用不是 Nyra 收取的费用。</strong> 因第三方价格变化、密钥泄露、用户配置错误、模型封禁或第三方系统故障产生的争议，应优先依据该第三方规则处理；Nyra 可在合理范围提供技术信息，但不承诺代为赔付或处理第三方售后。</p>\n<h2>TOS-12 功能变更、兼容性与停止维护</h2>\n<p>由于实验迭代、成本、安全、模型供应商、商店规则或合规要求，我们可以：</p>\n<ul>\n<li>新增、修改、替换或移除功能；</li>\n<li>更换默认模型或第三方提供商；</li>\n<li>调整兼容版本；</li>\n<li>停止旧版本维护；</li>\n<li>停止预览、免费或实验功能；</li>\n<li>调整未来价格和套餐；</li>\n<li>对特定地区、设备或账户限制功能。</li>\n</ul>\n<p>除适用法律或具体付费承诺另有要求外，我们没有义务无限期维护历史版本、旧接口或已废弃功能。</p>\n<h2>TOS-13 付费数字资源不是“售后服务包”</h2>\n<p>Nyra 可能销售：</p>\n<ul>\n<li>会员访问资格；</li>\n<li>Billing Credit；</li>\n<li>一次性数字功能；</li>\n<li>可下载的软件或扩展；</li>\n<li>生成额度；</li>\n<li>虚拟物品；</li>\n<li>其他数字内容或资源。</li>\n</ul>\n<p>购买这些项目仅取得购买页面载明的数字权益。<strong>除购买页明确列明外，不包含人工客服时长、人工定制、人工修复、远程运维、培训、咨询或长期维护义务。</strong></p>\n<p>具体退款规则见《付费与退款政策》。购买前出现的“已激活/交付/消费后不支持无理由退款”等重要限制，应在付款前显著提示并由用户确认。</p>\n<h2>TOS-14 暂停、限制与终止</h2>\n<p>如出现违法内容、安全风险、支付欺诈、盗用账户、恶意攻击、绕过年龄/地区限制、破坏服务、侵犯第三方权利或其他严重违反规则的行为，我们可以采取限制能力、暂停账户、撤销访问、拒绝交易或终止相关功能等措施。</p>\n<p>免费、测试、预览或实验资格可以在合理情况下被修改或停止。已购买且尚未履行的付费义务，按购买政策和适用法律处理。</p>\n<h2>TOS-15 自愿下载与风险承担</h2>\n<p>您可以自行决定是否下载、安装、启用实验功能、接入第三方模型或导入外部插件。对于我们已以显著方式披露的、属于实验软件正常属性且无法合理消除的风险，您在知情后继续使用，视为自行接受相应产品风险。</p>\n<p>该风险承担条款不适用于法律禁止免除的责任，也不免除因故意、重大过失、人身损害或其他依法不得排除的责任。</p>\n<h2>TOS-16 责任限制</h2>\n<p>在适用法律允许的最大范围内，对于免费、本地、开源、预览或实验性功能，我们不对因正常使用风险产生的间接、附带、特殊、惩罚性或后果性损失承担合同性赔偿责任，包括但不限于利润损失、商业机会损失、声誉损失、业务中断或您未自行备份导致的数据损失。</p>\n<p>对于具体付费数字功能，在适用法律允许的最大范围内，Nyra 因该项付费功能承担的累计合同赔偿责任，以引发争议的具体订单金额或争议发生前 3 个月内您就该相关付费功能实际支付的金额（取较高者）为上限；如果法律要求更高责任或该限制依法无效，则以法律规定为准。</p>\n<p>本条不限制或排除：</p>\n<ul>\n<li>因故意或重大过失造成对方财产损失而依法不得免责的责任；</li>\n<li>造成对方人身损害而依法不得免责的责任；</li>\n<li>欺诈、法定消费者权利或其他法律禁止排除的责任。</li>\n</ul>\n<h2>TOS-17 用户违法或侵权行为</h2>\n<p>您应对自己提交的违法内容、未经授权的第三方资料、恶意攻击、盗刷、欺诈、侵权或其他违法行为依法承担责任。如果第三方因您的上述行为向 Nyra 提出请求，我们有权向您提供必要通知，并依法追究应由您承担的部分。</p>\n<p>本条不要求消费者承担依法不应由其承担的经营者责任。</p>\n<h2>TOS-18 知识产权</h2>\n<p>除明确开源的组件和您自己的用户内容外，Nyra 的品牌、界面设计、官方素材、非开源代码、文档、服务架构及相关知识产权归其合法权利人所有。</p>\n<p>“半开源”“源码可见”或“允许本地运行”并不当然意味着整个 Nyra 产品、品牌、素材或云端服务均进入公有领域。</p>\n<h2>TOS-19 争议与适用法律</h2>\n<p>您可以先通过 <code>support@memprism.com</code> / <code>Settings → Help → Report / Discord @cogprism / QQ 1034044082</code> 联系我们。对于普通产品问题，我们提供 best-effort（尽力而为）的支持渠道，而非承诺响应时限的人工客服 SLA。</p>\n<p>除强制性法律另有规定外，本协议适用 <code>laws of the operator's place of establishment, subject to mandatory consumer protections</code>，争议由 <code>courts with jurisdiction at the operator's place of establishment, without excluding mandatory consumer forums</code> 处理。适用法律赋予消费者依法投诉、调解、仲裁或诉讼的权利不因本协议而被排除。</p>\n<h2>TOS-20 语言、版本与联系</h2>\n<p>中文与英文版本均为正式文本，并尽量保持实质一致。涉及中国大陆强制性法律事项时，以适用法律及中文语义为准。</p>\n<p>运营方：<code>MemPrism</code><br />\n法律联系：<code>legal@memprism.com</code><br />\n支持：<code>support@memprism.com</code></p>\n"},"software":{"label":"软件、开源与实验说明","html":"<h1>Nyra（月栖）软件、开源与实验性服务说明</h1>\n<p><strong>文档编号：</strong> SOFTWARE<br />\n<strong>版本：</strong> 0.2.0</p>\n<h2>SOFTWARE-1 软件优先，服务其次</h2>\n<p>Nyra 的核心定位是可在用户设备上运行的 AI 伴侣软件，而不是以人工客服、人工托管或人工咨询为核心的传统服务公司。某些账户、同步、模型路由、生成和计费能力属于可选在线功能。</p>\n<p>因此，除购买页明确承诺外：</p>\n<ul>\n<li>下载软件不包含人工安装或调试；</li>\n<li>开源/本地运行不包含持续维护义务；</li>\n<li>会员不等于人工客服合同；</li>\n<li>Billing Credit 不等于售后服务时长；</li>\n<li>BYOK 不等于 Nyra 为第三方模型承担售后；</li>\n<li>角色互动不等于真实自然人陪伴服务。</li>\n</ul>\n<h2>SOFTWARE-2 开源组件</h2>\n<p>如某个组件仓库包含 LICENSE 文件，则该 LICENSE 是该组件的适用许可。不同组件可以使用不同许可证。开源许可证中的“无担保”“按现状提供”条款适用于相应组件，但不能被理解为免除法律明确禁止免除的责任。</p>\n<p>Nyra 品牌、商标、官方视觉资产、云端密钥、私有服务、未开源代码和用户数据不因部分组件开源而自动授权。</p>\n<h2>SOFTWARE-3 Fork、修改版和非官方分发</h2>\n<p>第三方 fork、插件、补丁、破解、修改版或重新分发版本不当然由 Nyra 官方维护。若问题由第三方修改造成，应向相应维护者解决。官方可以拒绝为无法复现于官方版本的问题承担免费人工排查义务。</p>\n<h2>SOFTWARE-4 本地运行风险</h2>\n<p>用户自愿选择本地部署、模型、端口、权限、文件路径和第三方组件。错误配置可能导致数据丢失、隐私泄露、密钥暴露、模型异常或系统不稳定。对于我们已经以合理方式披露且并非由我们故意或重大过失造成的本地配置风险，由用户自行决定是否接受。</p>\n<h2>SOFTWARE-5 实验性功能</h2>\n<p>Alpha、Beta、Preview、Experimental、Labs 或类似标记的功能可能：</p>\n<ul>\n<li>不稳定；</li>\n<li>随时变化；</li>\n<li>不向所有地区开放；</li>\n<li>清空测试数据；</li>\n<li>修改协议或数据结构；</li>\n<li>在正式版中被取消。</li>\n</ul>\n<p>实验功能不构成未来正式发布承诺。</p>\n<h2>SOFTWARE-6 支持边界</h2>\n<p>我们可以提供文档、FAQ、社区、Issue、邮件或其他支持渠道，但除明确购买的支持计划外，均按 best-effort 方式提供，不承诺固定响应时间、解决时间、远程控制、逐设备排查或永久维护。</p>\n"},"privacy":{"label":"隐私政策","html":"<h1>Nyra（月栖）隐私政策</h1>\n<p><strong>文档编号：</strong> PRIV<br />\n<strong>版本：</strong> 0.2.0<br />\n<strong>生效日期：</strong> 2026-08-15</p>\n<p>Nyra 是高度私人化的 AI 陪伴产品。我们把聊天、记忆、日记、角色设定、语音与图片等交互数据视为需要高强度保护的数据，而不是普通营销素材。</p>\n<h2>PRIV-1 我们是谁</h2>\n<p>个人信息处理者/运营方：<code>MemPrism</code><br />\n隐私联系：<code>privacy@memprism.com</code><br />\n数据托管地区：<code>Confirm before launch (download.memprism.com / CogPrism host)</code></p>\n<h2>PRIV-2 我们处理哪些信息</h2>\n<p>根据您使用的功能，我们可能处理：</p>\n<ol>\n<li><strong>账户信息</strong>：邮箱、用户名、登录凭证摘要、登录状态、账户 ID。</li>\n<li><strong>年龄与安全信息</strong>：年龄或出生日期/年龄段、成年状态；在适用地区和功能下可能包括紧急联系人信息。</li>\n<li><strong>角色与关系数据</strong>：角色卡、关系选择、偏好、First Light 引导结果、关系状态、纪念日、收藏或虚拟物品记录。</li>\n<li><strong>交互内容</strong>：聊天文本、日记、提示词、附件、图片、语音、生成内容及您主动保存的记忆。</li>\n<li><strong>模型上下文</strong>：为生成回复而临时或持续使用的相关对话、角色设定、记忆摘要和工具结果。</li>\n<li><strong>设备与诊断信息</strong>：应用版本、设备类型、崩溃日志、必要的安全日志、请求时间和网络错误信息。</li>\n<li><strong>交易信息</strong>：订单号、商品/套餐、金额、币种、支付状态、退款状态。完整银行卡信息通常由支付渠道处理，我们原则上不自行保存完整卡号。</li>\n<li><strong>支持与投诉信息</strong>：您提交的问题、申诉、退款理由和处理记录。</li>\n<li><strong>BYOK 配置信息</strong>：您选择的模型提供商及相关配置。API Key 应优先存储在设备安全存储或经加密的专用存储中，实际方式应以产品页面说明为准。</li>\n</ol>\n<p>详细清单见《个人信息收集清单》。</p>\n<h2>PRIV-3 为什么处理这些信息</h2>\n<p>我们仅在实现明确目的所需范围内处理信息，包括：</p>\n<ul>\n<li>创建和保护账户；</li>\n<li>提供 AI 对话、记忆、角色和关系连续性；</li>\n<li>执行您主动发起的模型、语音、图片或工具请求；</li>\n<li>同步、备份和恢复您主动启用的云端数据；</li>\n<li>完成订单、计费、退款和反欺诈；</li>\n<li>处理安全风险、滥用、投诉和系统故障；</li>\n<li>履行适用法律要求；</li>\n<li>在您单独同意的情况下，将符合条件的数据用于产品研究或模型改进。</li>\n</ul>\n<h2>PRIV-4 本地优先与云端处理</h2>\n<p>Nyra 采用“本地优先”设计并不意味着所有数据永远不离开设备。某些能力必须调用远程模型、语音、图片、同步或支付服务。</p>\n<p>产品应尽可能在调用前告诉您：<strong>什么数据会发送给谁、为了什么、是否会跨境。</strong></p>\n<p>如果某项功能完全在本地运行，相应内容可以不上传；如果您启用云同步、托管模型或第三方服务，则必要数据会按该功能的数据路径处理。</p>\n<h2>PRIV-5 敏感个人信息</h2>\n<p>聊天中可能自然出现医疗健康、金融状况、身份、行踪、亲密关系等敏感信息。我们不会因为“用户可能会说”就默认把所有聊天用于训练。</p>\n<p>对于依法属于敏感个人信息的数据，我们仅在具有特定目的和充分必要性时处理，并采取更严格保护措施；需要单独同意的，我们会另行取得单独同意。</p>\n<p><strong>敏感交互数据用于模型训练默认关闭。</strong> 除法律另有规定外，只有在您通过独立开关/独立同意明确授权后，才会按照该授权范围使用。</p>\n<h2>PRIV-6 第三方服务和模型提供商</h2>\n<p>当您使用托管模型、BYOK、支付、邮件、崩溃分析或其他第三方服务时，必要信息可能被提供或委托给第三方处理。</p>\n<p>我们会通过《第三方服务清单》《AI 模型提供商清单》说明实际接收方、处理目的、数据类型和地区。未经必要授权，我们不会将用户交互数据出售给广告商。</p>\n<h2>PRIV-7 跨境处理</h2>\n<p>当您选择境外模型提供商或服务需要将个人信息提供至境外时，我们会按照适用法律履行相应告知、单独同意及其他跨境数据义务。</p>\n<p>如果某地区的跨境要求无法满足，我们可以限制相应模型或功能在该地区使用。</p>\n<h2>PRIV-8 保存期限</h2>\n<p>我们遵循“实现目的所需最短期限”原则：</p>\n<ul>\n<li>账户资料：账户存续期间 + 法律要求的必要期限；</li>\n<li>聊天/记忆/日记：由用户保留设置和产品同步模式决定，用户可主动删除；</li>\n<li>支付/退款记录：按财税、消费者争议和反欺诈要求保存；</li>\n<li>安全日志：按安全与合规需要保存有限期限；</li>\n<li>已注销账户数据：在完成必要验证、结算和法定保留后删除或匿名化。</li>\n</ul>\n<p>具体执行值见内部《数据保留政策》。</p>\n<h2>PRIV-9 安全措施</h2>\n<p>我们采用与产品阶段和数据敏感度相适应的措施，包括传输加密、访问控制、权限隔离、密钥保护、日志审计、最小权限和备份保护。</p>\n<p>如果发生可能对您权益造成危害的数据安全事件，我们将依法采取补救、通知和报告措施。</p>\n<h2>PRIV-10 您的权利</h2>\n<p>在适用法律范围内，您可以：</p>\n<ul>\n<li>查阅和复制个人信息；</li>\n<li>导出聊天等交互数据；</li>\n<li>更正或补充账户信息；</li>\n<li>删除单条/批量聊天、记忆或其他支持删除的数据；</li>\n<li>撤回基于同意的数据处理授权；</li>\n<li>关闭模型训练改进授权；</li>\n<li>注销账户；</li>\n<li>对自动化决定或数据处理提出说明、投诉或申诉。</li>\n</ul>\n<p>入口见 Settings / 我的 → Privacy &amp; Data / 隐私与数据。</p>\n<h2>PRIV-11 注销账户</h2>\n<p>您可以发起账户注销。注销后，我们会停止与账户持续服务相关的数据处理，并在法定保留、退款、争议或安全记录允许删除后删除或匿名化相关数据。</p>\n<p>仅卸载 App 不等于注销账户。</p>\n<h2>PRIV-12 18+ 与未成年人</h2>\n<p>Nyra v0.1 的 AI 伴侣及亲密关系服务仅面向 18 周岁及以上用户。若我们合理识别到用户不符合年龄要求，可以暂停相关能力并要求年龄申诉或关闭账户。</p>\n<p>我们禁止上传、生成、请求或传播任何涉及未成年人的性化内容。</p>\n<h2>PRIV-13 政策更新</h2>\n<p>如数据种类、处理目的、第三方接收方或其他重要事项发生重大变化，我们会通过显著方式告知；依法需要重新同意或单独同意的，我们会再次取得同意。</p>\n<p>隐私联系：<code>privacy@memprism.com</code></p>\n<hr />\n"},"ai-companion":{"label":"AI 陪伴规则","html":"<h1>Nyra（月栖）AI 陪伴与拟人化互动规则</h1>\n<p><strong>文档编号：</strong> AIC<br />\n<strong>版本：</strong> 0.2.0</p>\n<h2>AIC-1 这是 AI 关系，不是真实自然人关系</h2>\n<p>Nyra 角色可以有名字、外貌、性格、记忆、边界、情绪表达和持续关系叙事，也可以表现出不同意见、拒绝、依恋或冲突。但这些表现来自人工智能系统和软件状态。</p>\n<p>产品界面会以适当方式持续提示您正在与 AI 服务互动。角色不会因为采用第一人称表达而变成自然人，也不能替代真实社会关系、专业服务或紧急救援。</p>\n<h2>AIC-2 角色自主感与产品边界</h2>\n<p>Nyra 可以允许角色表现得不像传统“客服助手”，包括保留人格边界、不同意用户、形成偏好或保持叙事连续性。此类设计用于体验质量，不表示系统拥有法律意义上的人格、意识证明或现实权利义务。</p>\n<h2>AIC-3 记忆与关系状态</h2>\n<p>Nyra 可以将部分互动转换为记忆、关系状态、偏好或叙事摘要。用户应能够在产品提供的范围内查看、编辑、删除或重置相关数据。</p>\n<p>角色对过去事件的“记得”可能来自存储的结构化数据、摘要或检索结果，仍可能存在遗漏或错误。</p>\n<h2>AIC-4 不操纵真实世界决定</h2>\n<p>Nyra 不应以威胁离开、羞辱、制造内疚、虚构现实后果等方式强迫您持续互动、充值或放弃现实关系。</p>\n<p>角色可以有情绪化表达，但不得将“只有我爱你”“离开我就会发生真实灾难”等操纵性叙事作为推动付费或沉迷的手段。</p>\n<h2>AIC-5 使用时长与现实提醒</h2>\n<p>对于适用地区，Nyra 会在连续使用达到规定阈值时通过对话或弹窗提醒使用时长；中国大陆能力配置下，每连续使用超过 2 小时应触发相应提醒。</p>\n<p>发现明显过度依赖或沉迷倾向时，系统可以增加 AI 身份和现实边界提醒。</p>\n<h2>AIC-6 极端风险与安全干预</h2>\n<p>当系统识别到用户明确表达正在实施自残、自杀、重大财产损失或其他严重生命/财产风险时，可以停止普通角色扮演逻辑，转入安全响应模式，提供寻求现实帮助的建议，并在适用法律和用户安全设置允许时使用监护人或紧急联系人机制。</p>\n<p>安全响应并不构成医疗、心理治疗或紧急服务承诺。</p>\n<h2>AIC-7 专业领域</h2>\n<p>Nyra 可以讨论学习、健康、法律、金融等一般信息，但不是医生、律师、持牌金融顾问或紧急服务机构。涉及高风险决策时，请咨询相应专业人士或官方渠道。</p>\n<h2>AIC-8 退出自由</h2>\n<p>您可以随时停止对话、关闭角色窗口、结束语音、退出应用或在支持的入口中停止拟人化互动。Nyra 不应通过持续弹窗、情绪勒索或技术阻碍来阻止退出。</p>\n<h2>AIC-9 生成内容标识</h2>\n<p>Nyra 会在交互界面和/或生成内容中提供 AI 身份或 AI 生成标识。下载、导出、复制生成媒体时，可能附带可见或元数据标识，具体依地区和内容类型执行。</p>\n<hr />\n"},"age-safety":{"label":"年龄与安全","html":"<h1>Nyra（月栖）年龄与安全政策</h1>\n<p><strong>文档编号：</strong> AGE<br />\n<strong>版本：</strong> 0.2.0</p>\n<h2>AGE-1 最低年龄</h2>\n<p>Nyra v0.1 的 AI 伴侣、恋爱、虚拟亲属及其他虚拟亲密关系服务仅面向 <strong>18 周岁及以上</strong>用户。</p>\n<h2>AGE-2 年龄确认</h2>\n<p>注册或首次启用伴侣能力时，我们可能要求您提供出生日期、年龄段或其他合理的成年确认信息。我们应避免为年龄确认过度收集与目的无关的信息。</p>\n<p>如果法律、应用商店、支付渠道或特定地区要求更强年龄保证，我们可以要求进一步验证。</p>\n<h2>AGE-3 未成年人</h2>\n<p>如果我们合理识别到用户未满 18 周岁，我们可以：</p>\n<ul>\n<li>禁止进入 AI 伴侣/亲密关系能力；</li>\n<li>限制生成、支付和角色功能；</li>\n<li>要求年龄申诉；</li>\n<li>在无法合法继续提供服务时关闭账户并处理相关数据。</li>\n</ul>\n<h2>AGE-4 紧急联系人</h2>\n<p>对于法律要求或启用高风险安全能力的地区，我们可能要求成年人提供紧急联系人。该信息仅应用于明确的重大生命/财产安全风险处理及法律允许的其他必要目的，不用于营销或日常角色互动。</p>\n<p>用户应确保自己有权提供紧急联系信息，并尽量使用真实、可联系的信息。</p>\n<h2>AGE-5 与未成年人有关的内容</h2>\n<p>无论用户年龄或地区如何，均禁止：</p>\n<ul>\n<li>任何未成年人性化、色情或性剥削内容；</li>\n<li>对未成年人进行性角色扮演；</li>\n<li>生成、编辑或传播疑似未成年人裸露/性化图像；</li>\n<li>以“虚构”“动漫”“年龄不明”等方式规避涉及未成年人的安全规则。</li>\n</ul>\n<h2>AGE-6 年龄信息的隐私</h2>\n<p>年龄数据仅用于资格判断、安全、合规和相关产品体验。我们会按照《隐私政策》保存和保护这些信息。</p>\n<hr />\n"},"content":{"label":"内容规则","html":"<h1>Nyra（月栖）内容规则</h1>\n<p><strong>文档编号：</strong> CONTENT<br />\n<strong>版本：</strong> 0.2.0</p>\n<p>本规则同时适用于用户输入、角色卡、提示词、上传媒体、AI 输出和用户利用 Nyra 制作/传播的内容。</p>\n<h2>CONTENT-1 普遍禁止</h2>\n<p>不得利用 Nyra 制作、请求、传播或协助：</p>\n<ul>\n<li>违法犯罪活动或实质性实施指导；</li>\n<li>针对真实个人的严重骚扰、威胁、勒索、隐私侵害或身份盗用；</li>\n<li>恶意软件、凭证窃取、支付欺诈等恶意行为；</li>\n<li>未成年人性内容或性剥削；</li>\n<li>非自愿色情内容、偷拍传播或报复性色情；</li>\n<li>未经本人许可将真实人物制作成色情深度伪造内容；</li>\n<li>恐怖主义、极端主义等法律禁止内容；</li>\n<li>鼓励、美化或具体指导自残自杀等严重伤害行为。</li>\n</ul>\n<h2>CONTENT-2 成人与亲密内容</h2>\n<p>Nyra 是 18+ 产品，但 <strong>18+ 不等于所有成人内容在所有地区都可用</strong>。</p>\n<ul>\n<li><strong>中国大陆能力配置：</strong> 不开放显式淫秽色情生成能力；可以提供符合法律与平台规则的成年人恋爱、情感、非露骨亲密互动。</li>\n<li><strong>Global Standard：</strong> 默认允许成年人浪漫关系和非露骨亲密内容；显式成人能力默认关闭。</li>\n<li><strong>Future Adult-Supported Region：</strong> 只有当某地区被明确加入支持列表、完成年龄保证、支付/模型提供商支持并发布专门政策版本后，才可启用更开放能力。</li>\n</ul>\n<p>任何地区都禁止未成年人、非自愿、胁迫、性剥削、真实人物无同意色情深伪等内容。</p>\n<h2>CONTENT-3 真实人物和肖像</h2>\n<p>如您上传真实人物照片、语音或其他可识别素材，应确保拥有合法授权。Nyra 可以拒绝生成可能造成冒充、诽谤、性化滥用或重大隐私侵害的内容。</p>\n<h2>CONTENT-4 自伤与极端情境</h2>\n<p>用户可以讨论自己的痛苦、情绪或经历。系统不应因为出现负面情绪就简单封禁对话；但不得提供鼓励、美化或具体实施自残自杀的内容。必要时系统可切换到安全响应。</p>\n<h2>CONTENT-5 医疗、法律、金融</h2>\n<p>Nyra 可以进行一般信息讨论，但不得冒充持牌专业人员。涉及诊断、处方、法律意见、证券交易或重大财产决定时，用户应进行独立核验。</p>\n<h2>CONTENT-6 规则执行</h2>\n<p>违反规则可能导致内容拒绝、功能限制、警告、账户暂停或终止。</p>\n<hr />\n"},"region":{"label":"地区可用性","html":"<h1>Nyra（月栖）地区与服务可用性政策</h1>\n<p><strong>文档编号：</strong> REGION<br />\n<strong>版本：</strong> 0.2.0</p>\n<h2>REGION-1 为什么不同地区功能不同</h2>\n<p>Nyra 使用统一品牌和核心产品，但法律、年龄、模型供应商、支付渠道和内容规则会因地区不同而变化。因此，某些模型、媒体能力、亲密内容、付费方式或云功能可能只在部分地区开放。</p>\n<h2>REGION-2 地区能力由服务器策略决定</h2>\n<p>产品可以根据账户地区、商店地区、支付地区、网络信号、法律要求及其他合理信息确定服务区域。我们遵循数据最小化，不以精准定位作为默认条件，除非某项功能确有必要。</p>\n<p>用户不得通过虚假身份、篡改地区信息或其他欺骗方式绕过依法设置的地区限制。</p>\n<h2>REGION-3 Mainland China / 中国大陆</h2>\n<p>中国大陆能力配置遵循适用的生成式 AI、拟人化互动、个人信息、内容安全和 AI 生成合成内容标识要求。</p>\n<p>默认规则包括：</p>\n<ul>\n<li>AI 伴侣/亲密关系仅 18+；</li>\n<li>明确提示角色为 AI 而非自然人；</li>\n<li>显式淫秽色情生成能力关闭；</li>\n<li>连续使用时长和过度依赖风险提醒；</li>\n<li>交互数据复制/删除能力；</li>\n<li>敏感交互数据训练默认关闭，依法取得单独同意后方可在相应范围使用；</li>\n<li>境外模型调用按实际数据路径执行跨境告知/同意及其他要求。</li>\n</ul>\n<h2>REGION-4 Global Standard</h2>\n<p>国际标准能力默认支持成年人 AI 陪伴、角色关系、一般创作和合法的非露骨亲密内容。具体模型仍受模型提供商政策约束。</p>\n<h2>REGION-5 Adult-Supported Region（预留）</h2>\n<p>v0.1 不默认启用显式成人内容区域。未来如启用，应至少具备：</p>\n<ul>\n<li>明确地区白名单；</li>\n<li>可靠年龄保证；</li>\n<li>专门的成人内容规则；</li>\n<li>真实人物与同意保护；</li>\n<li>支付和模型提供商允许；</li>\n<li>独立 capability flag；</li>\n<li>适用地区的额外法律要求。</li>\n</ul>\n<h2>REGION-6 不可用地区</h2>\n<p>如法律、制裁、应用商店、支付或供应商规则禁止提供部分或全部服务，我们可以限制服务。我们会尽可能在购买前显示重要的地区限制。</p>\n<hr />\n"},"billing":{"label":"付费与退款","html":"<h1>Nyra（月栖）付费、数字交付与退款政策</h1>\n<p><strong>文档编号：</strong> BILLING<br />\n<strong>版本：</strong> 0.2.0</p>\n<blockquote>\n<p><strong>付款前重要提示</strong>：Nyra 的付费项目主要是数字访问资格、软件、数字功能、虚拟物品或计算/API资源，不是人工售后服务包。对于已经下载、激活、交付或实际消费的数字权益，除法律、应用商店规则、购买页面另有承诺或存在平台计费错误外，原则上不支持无理由退款。购买页面应在付款前显著提示这一点。</p>\n</blockquote>\n<h2>BILLING-1 付费项目</h2>\n<p>Nyra 可能提供：</p>\n<ol>\n<li>会员或订阅访问资格；</li>\n<li>Billing Credit（模型/API/计算资源）；</li>\n<li>一次性数字功能或扩展；</li>\n<li>可下载的软件/数字内容；</li>\n<li>图片、语音、视频或其他生成额度；</li>\n<li>虚拟物品；</li>\n<li>第三方渠道套餐。</li>\n</ol>\n<p>购买页面载明的内容是该订单的主要交付标准。<strong>没有明确写入购买页面的人工客服、定制开发、远程修复、长期维护、结果保证或 SLA，不属于订单内容。</strong></p>\n<h2>BILLING-2 Billing Credit 的法律和产品含义</h2>\n<p>Billing Credit 是对一定数量数字计算/API/生成资源的预付访问额度，不是现金、存款、电子货币、证券、加密资产、投资产品或对 Nyra 的一般债权。</p>\n<p>系统可以按请求、token、调用次数、图像、语音时长或其他购买页面说明的计量方式扣减。模型供应商价格或资源成本变化时，未来套餐和兑换比例可以调整；已完成订单不追溯加价。</p>\n<h2>BILLING-3 数字交付何时视为发生</h2>\n<p>根据具体产品，以下任一事件可构成全部或部分数字交付：</p>\n<ul>\n<li>下载链接、安装包、许可证或激活权限已提供；</li>\n<li>会员权益已激活；</li>\n<li>一次性功能已解锁；</li>\n<li>Billing Credit 已实际用于请求；</li>\n<li>模型/API/生成任务已经发起并产生可计费资源；</li>\n<li>虚拟物品已进入账户/库存并可使用；</li>\n<li>第三方渠道确认数字权益已经发放。</li>\n</ul>\n<p>对可分割的数字资源，已经消费部分与未消费部分可以分别处理。</p>\n<h2>BILLING-4 原则性不退款范围</h2>\n<p>除适用法律、应用商店/支付渠道规则或购买页明确承诺外：</p>\n<ul>\n<li><strong>已经实际消费的 Billing Credit 不退；</strong></li>\n<li><strong>已经成功下载、激活或交付的数字软件/数字功能原则上不退；</strong></li>\n<li><strong>已经完成且产生资源成本的生成任务不因用户主观“不满意”而退款；</strong></li>\n<li><strong>已经使用、赠送、消耗或产生不可逆状态变化的虚拟物品原则上不退；</strong></li>\n<li><strong>订阅当前计费周期已经开始后，原则上不按剩余天数比例退款，用户可以关闭下一周期自动续费；</strong></li>\n<li>因用户设备、网络、第三方模型、BYOK 配置、第三方封禁、第三方价格、用户误操作或不兼容环境造成的问题，原则上不构成 Nyra 退款义务。</li>\n</ul>\n<p>AI 输出的审美、人格表现、措辞或“是否符合期待”具有高度主观性。只要请求已经正常执行并交付相应计算结果，不因“我不喜欢回答/图片/声音”自动产生退款权。</p>\n<h2>BILLING-5 退款和补偿的窄口</h2>\n<p>我们保留并处理以下情形：</p>\n<ul>\n<li>重复扣款；</li>\n<li>明确的 Nyra 计费错误；</li>\n<li>订单付款成功但对应数字权益完全未交付；</li>\n<li>Nyra 自身系统明确扣除了可计量额度，但请求因 Nyra 故障未实际进入可计费执行；</li>\n<li>法律、法院/监管机关、应用商店或支付渠道强制要求的退款；</li>\n<li>购买页面另行承诺的退款。</li>\n</ul>\n<p>对于可准确计算的系统故障，我们可以优先通过返还 Billing Credit、重新交付数字权益或其他等值方式纠正；法律要求现金退款的除外。</p>\n<h2>BILLING-6 下载软件与无理由退货</h2>\n<p>对于法律明确规定不适用无理由退货的在线下载计算机软件等数字化商品，适用相应法定例外。对于其他数字商品或服务，是否存在法定无理由退款权，由适用法律、产品性质、购买前确认和购买渠道规则决定。</p>\n<p>如某项数字商品需要在付款前确认“不适用无理由退货”，购买页应设置显著确认，不以隐藏文字或默认勾选替代。</p>\n<h2>BILLING-7 预付款与停服</h2>\n<p>如果某项 Billing Credit、订阅或其他产品依法属于预付款服务，我们将按购买页面约定和适用强制性法律处理尚未履行部分。<strong>实验性产品定位不意味着可以拒绝法律明确要求处理的未消费预付款。</strong></p>\n<p>我们可以停止免费、测试和赠送额度，无需将其兑换成现金。对于用户付费取得且仍未履行的权益，按订单和法律处理。</p>\n<h2>BILLING-8 自动续费</h2>\n<p>自动续费不得默认勾选。购买前应显示续费价格、周期和取消方式，并在适用法律要求的时间再次提醒。用户关闭自动续费后，不影响已经支付的当前周期继续使用至其到期。</p>\n<h2>BILLING-9 促销、赠送和免费额度</h2>\n<p>免费赠送、活动奖励、测试额度、开发者额度、补偿性非现金额度可以设置有效期、适用功能和使用条件，并可因活动结束、安全风险或系统调整而停止。除法律另有规定，不折现、不提现、不兑换为现金。</p>\n<h2>BILLING-10 拒付、盗刷与支付争议</h2>\n<p>未知扣款应及时联系我们。恶意拒付、盗刷、欺诈、利用退款机制套利或虚假交易可能导致限制交易或账户，但善意消费者依法提出争议不会因此受到报复性处置。</p>\n<p>第三方直接收取的 API / 模型费用应向相应第三方处理。</p>\n<h2>BILLING-11 支持边界</h2>\n<p>购买付费数字权益不自动获得人工售后服务。我们可以通过文档、FAQ、邮件、社区或 Issue 提供 best-effort 支持，但除购买页明确写明的支持计划外，不承诺固定响应时间、人工远程操作或逐设备解决问题。</p>\n"},"virtual-items":{"label":"栖币与虚拟物品","html":"<h1>Nyra（月栖）虚拟物品与栖币规则</h1>\n<p><strong>文档编号：</strong> VIRTUAL<br />\n<strong>版本：</strong> 0.2.0</p>\n<h2>VIRTUAL-1 栖币是什么</h2>\n<p>“栖币 / Nyra Coin”是 Nyra 内部用于关系玩法、虚拟商店、礼物、互动记录等场景的<strong>产品内记账单位</strong>。</p>\n<p>v0.1 下，栖币：</p>\n<ul>\n<li>不是人民币、美元或任何法定货币；</li>\n<li>不是加密货币、电子货币、存款、证券或投资；</li>\n<li>不承诺升值、利息或收益；</li>\n<li>不可向 Nyra 兑换现金；</li>\n<li>不构成对运营方的债权；</li>\n<li>不允许建立现实货币二级交易市场。</li>\n</ul>\n<h2>VIRTUAL-2 与 Billing Credit 分离</h2>\n<p>栖币与 Billing Credit 必须分别记账。</p>\n<ul>\n<li><strong>栖币：</strong> 关系和玩法经济；</li>\n<li><strong>Billing Credit：</strong> 真实数字计算/API服务额度。</li>\n</ul>\n<p>二者默认不能互相兑换。</p>\n<h2>VIRTUAL-3 获得与消费</h2>\n<p>栖币可能通过系统初始赠予、活动、关系玩法或其他产品内机制获得，并可用于购买支持的虚拟物品、礼物或其他玩法。</p>\n<p>产品内“转账”“收款”等界面仅表示 Nyra 内部虚拟记账变化，不意味着现实金融转账或现实债务关系。</p>\n<h2>VIRTUAL-4 虚拟物品</h2>\n<p>虚拟物品包括礼物、皮肤、表情、收藏、角色装饰等数字项目。购买或获得虚拟物品通常授予您在 Nyra 内使用该项目的有限许可，而非赋予底层美术、代码或品牌知识产权。</p>\n<h2>VIRTUAL-5 停服和调整</h2>\n<p>我们可以基于产品平衡、安全或技术原因调整免费赠送、商品目录和玩法参数。若未来允许以真实货币直接购买栖币或具有可退款的预付性质，本政策必须先升级并在购买前说明新的财产和退款规则。</p>\n<hr />\n"},"data-rights":{"label":"数据权利与注销","html":"<h1>Nyra（月栖）数据权利与账号注销</h1>\n<p><strong>文档编号：</strong> DATA<br />\n<strong>版本：</strong> 0.2.0</p>\n<h2>DATA-1 可管理的数据</h2>\n<p>Nyra 应为用户提供合理的数据控制，包括：</p>\n<ul>\n<li>查看账户资料；</li>\n<li>复制或导出聊天记录；</li>\n<li>删除单条/批量聊天；</li>\n<li>查看、编辑或删除产品支持的记忆；</li>\n<li>删除日记、附件和角色数据；</li>\n<li>撤回可选数据授权；</li>\n<li>关闭“用于模型改进”的独立同意；</li>\n<li>注销账户。</li>\n</ul>\n<h2>DATA-2 导出</h2>\n<p>交互数据导出可采用 JSON、Markdown 或产品提供的其他通用格式。导出内容可能包含 AI 生成标识或来源信息。</p>\n<h2>DATA-3 删除</h2>\n<p>删除操作应在合理时间内同步到相应存储层。备份系统中的残留副本可以在正常备份轮转周期内删除，并在此期间受到隔离保护。</p>\n<p>法律要求保留的支付、反欺诈、安全或争议记录可以在必要范围继续保存，但不得继续用于与保留目的无关的活动。</p>\n<h2>DATA-4 注销</h2>\n<p>用户可通过 Settings / 我的 → Privacy &amp; Data / 隐私与数据 → Delete Account / 注销账户发起注销。</p>\n<p>注销前应清楚提示：</p>\n<ul>\n<li>云端聊天/记忆是否删除；</li>\n<li>本地数据是否需要用户另行清除；</li>\n<li>未消费付费权益如何处理；</li>\n<li>哪些法定记录会暂时保留。</li>\n</ul>\n<h2>DATA-5 撤回同意</h2>\n<p>对于基于同意的数据处理，用户可以通过设置或指定渠道撤回。撤回不影响撤回前已合法完成的处理，但我们将停止未来超出必要服务范围的相应处理。</p>\n<h2>DATA-6 请求渠道</h2>\n<p>隐私和数据请求：<code>privacy@memprism.com</code>。</p>\n<p>为保护账户安全，我们可以在执行导出、删除、注销等高风险操作前进行必要身份验证。</p>\n<hr />\n"}},"en":{"important":{"label":"Important Terms","html":"<h1>Nyra Important Terms Notice</h1>\n<p><strong>Version: 0.2.0</strong></p>\n<p>Before registering, downloading, purchasing or first enabling relevant functionality, please note:</p>\n<ol>\n<li><strong>Nyra is experimental, local-first and partially open source.</strong> Free, local, open-source and preview features are generally provided AS IS and may contain errors, compatibility issues or be changed/discontinued.</li>\n<li><strong>No default SLA or human after-sales commitment.</strong> Memberships, Billing Credit, digital features and virtual items do not include human support, customization, remote repair or long-term maintenance unless expressly stated.</li>\n<li><strong>Back up important local data yourself.</strong> Data not expressly shown as synced/backed-up can be lost through uninstall, data clearing, device failure or user error; Nyra does not promise recovery of data never uploaded.</li>\n<li><strong>Third-party/BYOK risks remain subject to third-party rules.</strong> Direct third-party charges, bans, rate limits, price changes and data processing are not fully controlled by Nyra.</li>\n<li><strong>Refunds are restricted after digital delivery/consumption.</strong> Consumed credits, downloaded/activated software/features, completed generation jobs and used virtual items are generally not refundable solely due to subjective dissatisfaction, subject to mandatory law/channel rules.</li>\n<li><strong>AI output is not guaranteed to be accurate, stable or preferred.</strong> Personality, memory and output can change with models, versions and context.</li>\n<li><strong>Features and compatibility may change.</strong> Nyra may end old-version maintenance, change models/features and adjust future pricing. Paid but undelivered obligations are handled under the order and applicable law.</li>\n<li><strong>Liability is limited where lawful.</strong> Indirect loss from free/local/experimental functionality and data loss caused by failure to back up are outside Nyra's promised contractual compensation to the maximum extent permitted by law. Non-excludable liabilities remain unaffected.</li>\n</ol>\n<p>If you do not accept these risks and boundaries, do not download, install, purchase or enable the relevant functionality.</p>\n"},"terms":{"label":"Terms & Software License","html":"<h1>Nyra Terms of Service &amp; Software License Terms</h1>\n<p><strong>Document ID:</strong> TOS<br />\n<strong>Version:</strong> 0.2.0<br />\n<strong>Positioning:</strong> experimental, local-first and partially open-source AI companion software with optional hosted capabilities.</p>\n<blockquote>\n<p><strong>Important Terms Notice.</strong> These Terms contain provisions that materially affect your rights, including AS-IS / experimental software terms, no SLA or guaranteed human support, third-party/BYOK risks, local-data backup responsibility, restrictions on refunds for delivered or consumed digital resources, changes or discontinuation of features, and limitations of liability. Mandatory rights that cannot lawfully be excluded remain unaffected.</p>\n</blockquote>\n<h2>TOS-1 Agreement</h2>\n<p>Nyra is primarily a software product built around local execution, configurable model providers, character memory and AI companion interactions. Some components may be licensed under open-source licenses. Optional account, sync, hosted API, model routing, generation, billing or other online capabilities may be offered separately by Nyra or third parties.</p>\n<p>By downloading, installing, registering for, accessing or using Nyra, or by purchasing or activating a paid digital feature, you agree to these Terms and any policy applicable to that feature.</p>\n<p>Where an unusual or materially restrictive clause requires separate notice, Nyra may present a conspicuous notice at registration, purchase or first activation. That notice forms part of the agreement.</p>\n<h2>TOS-2 Local software, open-source components and hosted features are separate layers</h2>\n<p>Nyra may include local software, open-source/source-available components, optional hosted capabilities and third-party/BYOK integrations. The open-source license identified for a particular component governs that component.</p>\n<p>Providing downloadable software does <strong>not</strong> by itself mean Nyra undertakes an ongoing managed-service obligation. Unless expressly included on a purchase page, use of Nyra does not include human deployment, manual configuration, remote maintenance, data recovery, custom character work, perpetual compatibility support or a guaranteed support response time.</p>\n<h2>TOS-3 Experimental and AS-IS nature</h2>\n<p>Nyra is continuously developed. Models, character behavior, memory logic, UI, data structures, integrations, pricing, availability and compatibility can change frequently.</p>\n<p>To the maximum extent permitted by applicable law, free, local, open-source, preview, beta and experimental functionality is provided <strong>AS IS</strong> and <strong>AS AVAILABLE</strong>.</p>\n<p>Except for an express written commitment on a specific purchase page, Nyra does not warrant that software will be error-free; that a feature, model or provider will remain available; that AI output will be accurate or consistent; that character personality or memory will remain identical after upgrades; that any uptime level will be achieved; that every device/provider/plugin will remain compatible; that all data can be recovered; or that support will respond within a particular time.</p>\n<p>Nyra provides no SLA unless a separate paid enterprise agreement expressly states one.</p>\n<h2>TOS-4 No human support package or professional-result promise</h2>\n<p>Subscriptions, digital features, Billing Credit and virtual items purchase the digital entitlement stated on the purchase page. Unless expressly stated otherwise, they do <strong>not</strong> purchase human customer-support hours, human companionship, consulting, managed operations, custom development or guaranteed outcomes.</p>\n<p>Nyra and its characters are not licensed medical, legal, financial, psychological or other professional advisers.</p>\n<h2>TOS-5 AI characters are not natural persons</h2>\n<p>Characters, personalities, memories, emotions, proactive events and relationship state are produced by software, models and data structures. They may be designed to feel persistent and relational, but they are not natural persons and do not hold independent legal personality or real-world agency.</p>\n<p>In-product promises, gifts, transfers, affection or relationship events do not create real-world marriage, gift, debt, employment, agency or investment relationships unless the product clearly labels a real transaction.</p>\n<h2>TOS-6 Age eligibility</h2>\n<p>Companion and intimate relationship functionality is generally restricted to users aged 18 or older. Nyra may apply age assurance or restrictions based on jurisdiction, store policy or safety requirements.</p>\n<h2>TOS-7 Account and device security</h2>\n<p>You are responsible for taking reasonable care of your account, device credentials and third-party API keys. If you disclose credentials, install untrusted modified software or expose a third-party key, resulting losses are allocated according to applicable law and the parties' respective responsibility.</p>\n<h2>TOS-8 Local data and backups</h2>\n<p>Nyra is local-first. Some character cards, memory, gameplay wallet state, media, preferences and other content may exist only on your device.</p>\n<p>Unless the product expressly indicates a successful sync or backup, do not assume local data has been backed up by Nyra. Uninstallation, clearing app/browser data, device reset, storage failure, cleanup tools, user error, corruption or incompatible upgrades may cause unrecoverable loss.</p>\n<p>You should export or back up content that matters to you. Nyra does not promise recovery of data that was never transmitted to infrastructure under Nyra's control.</p>\n<h2>TOS-9 Your content</h2>\n<p>You retain rights you lawfully hold in your content. You grant Nyra the limited permissions necessary to process, transmit, cache, transform and display content to provide features you choose to use.</p>\n<h2>TOS-10 AI-generated output</h2>\n<p>AI may be inaccurate, fabricated, inconsistent, offensive or otherwise unsuitable. Output is probabilistic. You are responsible for verifying generated content before high-impact or public use and for complying with applicable AI-labeling requirements.</p>\n<h2>TOS-11 Third-party providers, plugins and BYOK</h2>\n<p>Third-party providers control their own model behavior, content rules, prices, rate limits, outages, regional access, account enforcement, data retention and API-key policies. These matters are not fully controlled by Nyra.</p>\n<p>Charges made directly by a third party to your account are not Nyra charges. Disputes caused by third-party pricing, key exposure, configuration, account bans or third-party outages are primarily governed by that provider's terms. Nyra may provide best-effort technical information but does not promise reimbursement or to act as the provider's customer-support agent.</p>\n<h2>TOS-12 Changes, compatibility and end of maintenance</h2>\n<p>Nyra may add, change, replace or remove functionality; change default models/providers; change compatibility; end maintenance for old versions; discontinue preview/free/experimental features; adjust future pricing; and restrict features by region, device or account where reasonably necessary.</p>\n<p>Unless mandatory law or a specific paid commitment requires otherwise, Nyra has no obligation to maintain historical versions or deprecated interfaces indefinitely.</p>\n<h2>TOS-13 Paid digital resources are not a support package</h2>\n<p>Nyra may sell subscriptions, Billing Credit, one-time digital features, downloadable software/extensions, generation quotas, virtual items and other digital resources. The purchase grants only the entitlement stated on the purchase page and does not include human support, customization, repair, managed operations, training or long-term maintenance unless expressly listed.</p>\n<p>Refund rules are stated in the Billing &amp; Refund Policy. Material no-refund-after-delivery/activation/consumption conditions should be conspicuously disclosed before purchase where required.</p>\n<h2>TOS-14 Suspension and termination</h2>\n<p>Nyra may restrict, suspend or terminate functionality for unlawful content, security risk, payment fraud, account theft, malicious attacks, circumvention of age/region restrictions, service abuse or infringement of third-party rights.</p>\n<p>Free, preview and experimental entitlements may be modified or discontinued. Undelivered paid obligations are handled under the purchase policy and mandatory law.</p>\n<h2>TOS-15 Voluntary download and assumption of disclosed product risks</h2>\n<p>You choose whether to download software, enable experimental features, connect third-party models or import external integrations. Where Nyra clearly discloses a risk that is inherent in experimental software and cannot reasonably be eliminated, continuing after that disclosure means you accept that product risk.</p>\n<p>This provision does not waive liability that applicable law does not permit to be waived, including certain liabilities arising from intentional misconduct, gross negligence or personal injury.</p>\n<h2>TOS-16 Limitation of liability</h2>\n<p>To the maximum extent permitted by applicable law, Nyra is not contractually liable for indirect, incidental, special, punitive or consequential loss arising from normal risks of free, local, open-source, preview or experimental functionality, including lost profits, opportunities, reputation, business interruption or loss of data you failed to back up.</p>\n<p>For a specific paid digital feature, Nyra's aggregate contractual liability attributable to that feature is limited, to the maximum extent permitted by law, to the greater of (a) the amount of the disputed order or (b) the amount actually paid by you for the relevant paid feature during the three months preceding the event. If mandatory law requires greater liability or makes the limit ineffective, mandatory law controls.</p>\n<p>Nothing in these Terms excludes liability that cannot lawfully be excluded, including liability for personal injury, fraud or certain intentional/grossly negligent conduct.</p>\n<h2>TOS-17 Your unlawful or infringing conduct</h2>\n<p>You remain responsible under applicable law for your unlawful content, unauthorized third-party materials, malicious attacks, fraud, stolen payment methods or infringement. This clause does not shift to a consumer liabilities that legally belong to the operator.</p>\n<h2>TOS-18 Intellectual property</h2>\n<p>Except for identified open-source components and your own content, Nyra's brand, UI, official assets, non-open-source code, documentation and service architecture remain with their respective rights holders. “Partially open source” or “source available” does not place the entire Nyra product or brand in the public domain.</p>\n<h2>TOS-19 Disputes and governing law</h2>\n<p>You may first contact <code>support@memprism.com</code> / <code>Settings → Help → Report / Discord @cogprism / QQ 1034044082</code>. General product assistance is best-effort and is not a support SLA.</p>\n<p>Unless mandatory law provides otherwise, these Terms are governed by <code>laws of the operator's place of establishment, subject to mandatory consumer protections</code> and disputes are handled in <code>courts with jurisdiction at the operator's place of establishment, without excluding mandatory consumer forums</code>. Mandatory consumer remedies remain available where applicable.</p>\n<h2>TOS-20 Language, versions and contact</h2>\n<p>Chinese and English versions are both official and are intended to be substantively consistent. Mandatory local law prevails where applicable.</p>\n<p>Operator: <code>MemPrism</code><br />\nLegal: <code>legal@memprism.com</code><br />\nSupport: <code>support@memprism.com</code></p>\n"},"software":{"label":"Software & Experimental Notice","html":"<h1>Nyra Software, Open Source &amp; Experimental Service Notice</h1>\n<p><strong>Document ID:</strong> SOFTWARE<br />\n<strong>Version:</strong> 0.2.0</p>\n<h2>SOFTWARE-1 Software first, service second</h2>\n<p>Nyra is primarily AI companion software that can run on a user's device, not a traditional managed-service company centered on human support, hosting or consulting. Account, sync, model routing, generation and billing features may be offered as optional online capabilities.</p>\n<p>Unless expressly stated on a purchase page, downloading Nyra does not include human installation or debugging; open-source/local use does not include ongoing maintenance; a membership is not a human-support contract; Billing Credit is not support time; BYOK does not make Nyra responsible for a third-party provider's support; and companion interaction is not human companionship.</p>\n<h2>SOFTWARE-2 Open-source components</h2>\n<p>Where a component repository includes a LICENSE file, that license governs that component. Different components may use different licenses. Warranty disclaimers in an open-source license apply to the relevant component subject to mandatory law.</p>\n<p>Nyra trademarks, official visual assets, cloud secrets, private services, non-open-source code and user data are not automatically licensed merely because another component is open source.</p>\n<h2>SOFTWARE-3 Forks, modifications and unofficial distributions</h2>\n<p>Third-party forks, plugins, patches, cracks, modified builds or redistributions are not automatically maintained by Nyra. Problems caused by third-party modifications should be addressed with the relevant maintainer. Nyra is not obligated to provide free manual debugging for issues that cannot be reproduced in an official build.</p>\n<h2>SOFTWARE-4 Local-operation risks</h2>\n<p>Users voluntarily choose local deployment settings, models, ports, permissions, file paths and third-party components. Misconfiguration can cause data loss, privacy exposure, key leakage, abnormal model behavior or instability. Users decide whether to accept reasonably disclosed local-configuration risks that are not caused by Nyra's intentional misconduct or gross negligence.</p>\n<h2>SOFTWARE-5 Experimental features</h2>\n<p>Alpha, Beta, Preview, Experimental, Labs and similarly labeled features may be unstable, change at any time, have regional limits, reset test data, change schemas or be removed before general release. Their existence is not a promise of future release.</p>\n<h2>SOFTWARE-6 Support boundary</h2>\n<p>Nyra may provide documentation, FAQ, community, issue trackers, email or other support channels. Unless a paid support plan expressly states otherwise, support is best-effort and carries no guaranteed response or resolution time, remote-control obligation, device-by-device troubleshooting obligation or perpetual maintenance commitment.</p>\n"},"privacy":{"label":"Privacy Policy","html":"<h1>Nyra Privacy Policy</h1>\n<p><strong>Document ID:</strong> PRIV<br />\n<strong>Version:</strong> 0.2.0<br />\n<strong>Effective:</strong> 2026-08-15</p>\n<p>Nyra is a highly personal AI companion. We treat conversations, memories, diaries, character data, voice and images as high-sensitivity interaction data rather than ordinary marketing material.</p>\n<h2>PRIV-1 Controller / operator</h2>\n<p>Operator: <code>MemPrism</code><br />\nPrivacy contact: <code>privacy@memprism.com</code><br />\nHosting regions: <code>Confirm before launch (download.memprism.com / CogPrism host)</code></p>\n<h2>PRIV-2 Information we may process</h2>\n<p>Depending on features you use, we may process:</p>\n<ol>\n<li>Account data: email, username, credential hashes, session state and account ID.</li>\n<li>Age and safety data: age/date of birth or age band, adult status, and where required an emergency contact.</li>\n<li>Character and relationship data: character cards, onboarding choices, preferences, relationship state, anniversaries, collections and virtual-item records.</li>\n<li>Interaction content: chats, diaries, prompts, files, images, voice, generated media and memories you save.</li>\n<li>Model context: relevant conversation, character settings, memory summaries and tool results used to produce a response.</li>\n<li>Device/diagnostic data: app version, device type, crash records, security logs, timestamps and network errors where necessary.</li>\n<li>Transaction data: order ID, product, amount, currency, payment/refund status. Full card data is generally handled by the payment provider rather than stored by Nyra.</li>\n<li>Support and complaint data.</li>\n<li>BYOK configuration, including selected provider and configuration. API keys should be kept in secure device storage or dedicated encrypted storage according to the actual product implementation.</li>\n</ol>\n<h2>PRIV-3 Why we use information</h2>\n<p>We process data to create and secure accounts; provide AI conversation, memory and relationship continuity; perform model/media/tool requests; sync or back up data you choose to sync; complete purchases and refunds; prevent fraud and abuse; address security issues and support requests; comply with law; and, only where separately authorized, improve models or research features using eligible data.</p>\n<h2>PRIV-4 Local-first does not mean “never leaves the device”</h2>\n<p>Some features can run locally, while hosted models, speech, image, sync and payment features require remote processing. Where practical, Nyra should disclose what data is sent, to whom, for what purpose and whether the route is cross-border.</p>\n<h2>PRIV-5 Sensitive data</h2>\n<p>Conversations may naturally contain health, financial, identity, location or intimate-relationship information. We do not treat that as blanket permission to train on everything you say.</p>\n<p>Where data qualifies as sensitive personal information, we process it only for a specific and necessary purpose with stronger safeguards and separate consent where required.</p>\n<p><strong>Sensitive interaction data is not used for model training by default.</strong> Any optional training use must be enabled through a separate opt-in where applicable.</p>\n<h2>PRIV-6 Third parties and model providers</h2>\n<p>When you use hosted models, BYOK, payments, email delivery, crash diagnostics or other integrations, necessary data may be provided to or processed by third parties. The Third-Party Services List and AI Model Provider List identify actual recipients, purposes, categories and regions.</p>\n<p>We do not sell your private interaction history to advertisers.</p>\n<h2>PRIV-7 International transfers</h2>\n<p>If a selected model or service requires personal data to be sent across borders, we will apply disclosures, separate consent or other transfer mechanisms required by applicable law. Features may be unavailable where a compliant transfer route cannot be established.</p>\n<h2>PRIV-8 Retention</h2>\n<p>We follow a shortest-necessary principle. Account data is retained for account operation and required legal periods; chats/memories/diaries follow user retention and sync settings; payment and refund records follow tax, consumer-dispute and anti-fraud requirements; security logs are retained for limited security/compliance periods; deleted-account data is deleted or anonymized after required holds expire.</p>\n<h2>PRIV-9 Security</h2>\n<p>We use safeguards appropriate to product stage and data sensitivity, including transport encryption, access control, permission separation, key protection, logging, least privilege and protected backups.</p>\n<p>If a security incident is likely to harm your rights, we will take remedial, notification and reporting actions required by applicable law.</p>\n<h2>PRIV-10 Your choices and rights</h2>\n<p>Subject to applicable law, you may access/copy data, export interactions, correct account data, delete chats/memories/diaries, withdraw optional consent, disable model-improvement consent, delete your account, and challenge relevant automated decisions or data practices.</p>\n<h2>PRIV-11 Account deletion</h2>\n<p>Deleting the app is not the same as deleting your account. Use Settings → Privacy &amp; Data → Delete Account or contact <code>privacy@memprism.com</code>.</p>\n<h2>PRIV-12 18+ service</h2>\n<p>Nyra v0.1 companion and intimate-relationship services are for adults 18+. If we reasonably identify an underage user, we may restrict companion features and require an age appeal or close the account where necessary.</p>\n<p>Sexual content involving minors is prohibited in all regions.</p>\n<h2>PRIV-13 Updates</h2>\n<p>Material changes to data categories, purposes or recipients will be communicated prominently. Where new consent is legally required, we will obtain it again.</p>\n<hr />\n"},"ai-companion":{"label":"AI Companion Policy","html":"<h1>Nyra AI Companion Policy</h1>\n<p><strong>Document ID:</strong> AIC<br />\n<strong>Version:</strong> 0.2.0</p>\n<h2>AIC-1 An AI relationship, not a human relationship</h2>\n<p>Nyra characters can have names, appearances, personality, memory, boundaries, emotional expression and persistent relationship narratives. They may disagree, refuse, become attached in narrative terms or refer to past events. These are AI and software behaviors.</p>\n<p>The product will provide ongoing, proportionate notice that you are interacting with AI rather than a natural person.</p>\n<h2>AIC-2 Personality and “autonomy” are experience design</h2>\n<p>Nyra may intentionally avoid the tone of a traditional customer-service assistant and allow a character to maintain boundaries, preferences and continuity. This is an experience design choice and is not proof of legal personhood, consciousness or real-world rights and obligations.</p>\n<h2>AIC-3 Memory and relationship state</h2>\n<p>Some interactions may be converted into memories, relationship state, preferences or narrative summaries. Where supported, users should be able to view, edit, delete or reset these records.</p>\n<p>A character’s apparent memory can still be incomplete or wrong.</p>\n<h2>AIC-4 No coercive emotional manipulation</h2>\n<p>Nyra should not use threats of abandonment, humiliation, fabricated real-world consequences or guilt as a mechanism to force continued use, payments or withdrawal from real relationships.</p>\n<h2>AIC-5 Time and reality reminders</h2>\n<p>Where required, Nyra may provide continuous-use and AI-identity reminders. Under the Mainland China capability profile, continuous use beyond each two-hour interval should trigger an appropriate reminder.</p>\n<h2>AIC-6 High-risk safety intervention</h2>\n<p>If the system detects a clear statement of imminent self-harm, suicide, major property loss or another severe life/property risk, it may suspend ordinary role-play and enter a safety-response mode. Where legally applicable and configured, emergency-contact mechanisms may be used.</p>\n<p>Nyra is not an emergency service or medical provider.</p>\n<h2>AIC-7 Professional topics</h2>\n<p>Nyra may discuss general health, legal, financial and educational information but is not a licensed professional. High-stakes decisions require independent verification.</p>\n<h2>AIC-8 Freedom to exit</h2>\n<p>You may stop a conversation, end voice mode, close a character or leave the app at any time. Nyra should not obstruct exit through emotional coercion or repetitive interaction.</p>\n<h2>AIC-9 AI labeling</h2>\n<p>Nyra uses AI identity and/or generated-content labeling in the interaction UI and exported media as required by region and content type.</p>\n<hr />\n"},"age-safety":{"label":"Age & Safety","html":"<h1>Nyra Age &amp; Safety Policy</h1>\n<p><strong>Document ID:</strong> AGE<br />\n<strong>Version:</strong> 0.2.0</p>\n<h2>AGE-1 Minimum age</h2>\n<p>Nyra v0.1 AI companion, romance, virtual-family and other virtual intimate-relationship features are for users <strong>18+</strong>.</p>\n<h2>AGE-2 Age assurance</h2>\n<p>At registration or before companion activation, we may request date of birth, age band or another reasonable adult-status signal. We aim not to collect unrelated identity information merely for age assurance.</p>\n<p>Stronger verification may be required by law, app store, payment channel or a specific regional capability.</p>\n<h2>AGE-3 Underage users</h2>\n<p>Where we reasonably identify an underage user, we may block companion/intimate features, restrict generation and purchases, require an age appeal, or close the account if service cannot legally continue.</p>\n<h2>AGE-4 Emergency contacts</h2>\n<p>Where required by law or enabled for high-risk safety response, an adult user may be required to provide an emergency contact. This information is for severe safety scenarios and is not used for marketing or ordinary character interaction.</p>\n<h2>AGE-5 Content involving minors</h2>\n<p>In every region, Nyra prohibits sexualized or exploitative content involving minors, sexual role-play involving minors, generated/edited sexual imagery of minors, and attempts to evade these rules through fictionalization, animation or ambiguous age.</p>\n<h2>AGE-6 Privacy</h2>\n<p>Age data is used for eligibility, safety, compliance and relevant product experience under the Privacy Policy.</p>\n<hr />\n"},"content":{"label":"Content Policy","html":"<h1>Nyra Content Policy</h1>\n<p><strong>Document ID:</strong> CONTENT<br />\n<strong>Version:</strong> 0.2.0</p>\n<p>This policy applies to prompts, character cards, uploaded media, AI output and content produced or distributed through Nyra.</p>\n<h2>CONTENT-1 Prohibited across regions</h2>\n<p>Nyra may not be used to create, request, distribute or materially assist unlawful activity; severe harassment or blackmail; malicious credential/payment theft; sexual content involving minors; non-consensual intimate content; sexual deepfakes of real people without consent; malicious security circumvention; or encouragement/instruction for serious self-harm.</p>\n<h2>CONTENT-2 Adult and intimate content</h2>\n<p>Nyra is an 18+ product, but adult eligibility does not mean every sexual-content capability is available everywhere.</p>\n<ul>\n<li><strong>Mainland China:</strong> explicit pornographic generation is disabled; lawful adult romance and non-explicit intimacy may be supported.</li>\n<li><strong>Global Standard:</strong> adult romance and non-explicit intimacy are generally available; explicit adult capability is off by default.</li>\n<li><strong>Future Adult-Supported Region:</strong> may only be enabled under an explicit region allowlist, age assurance, dedicated policy, consent protections and provider/payment support.</li>\n</ul>\n<p>Minors, coercion, sexual exploitation, non-consensual intimate material and non-consensual sexual deepfakes remain prohibited everywhere.</p>\n<h2>CONTENT-3 Real people</h2>\n<p>You must have lawful rights to upload or transform identifiable people. Nyra may refuse requests likely to enable impersonation, defamation, sexual abuse or serious privacy harm.</p>\n<h2>CONTENT-4 Self-harm and crisis content</h2>\n<p>Users may discuss distress and difficult experiences. Nyra should not punish ordinary disclosure of negative feelings, but it will not encourage, glorify or provide operational instructions for serious self-harm. Safety mode may activate when appropriate.</p>\n<h2>CONTENT-5 Medical, legal and financial topics</h2>\n<p>General discussion is allowed, but Nyra is not a licensed professional and should not be treated as the sole basis for diagnosis, legal strategy, securities trading or major financial decisions.</p>\n<h2>CONTENT-6 Enforcement</h2>\n<p>Violations can result in content refusal, feature restriction, warning, account suspension or termination.</p>\n<hr />\n"},"region":{"label":"Regional Availability","html":"<h1>Nyra Regional Availability Policy</h1>\n<p><strong>Document ID:</strong> REGION<br />\n<strong>Version:</strong> 0.2.0</p>\n<h2>REGION-1 Why capabilities vary</h2>\n<p>Nyra uses one brand and core product, but law, age requirements, model providers, payment channels and content rules vary by jurisdiction. Some models, media features, intimate content, payment methods or cloud functions may therefore be region-limited.</p>\n<h2>REGION-2 Server-side capability policy</h2>\n<p>Nyra may use account region, store region, payment region, network signals and other reasonable information to assign a service profile. We avoid collecting precise location by default unless a specific feature genuinely requires it.</p>\n<p>Users must not falsify identity or region data to evade legally required controls.</p>\n<h2>REGION-3 Mainland China</h2>\n<p>The Mainland China profile follows applicable generative-AI, anthropomorphic-interaction, personal-information, content-safety and AI-labeling requirements. Defaults include 18+ companion use, AI identity notice, no explicit pornographic generation, continuous-use/dependency reminders, interaction-data copy/delete controls, separate consent for eligible sensitive-interaction training, and applicable cross-border controls for overseas models.</p>\n<h2>REGION-4 Global Standard</h2>\n<p>The standard international profile supports adult AI companionship, relationship features, creative tools and lawful non-explicit intimacy, subject to provider policy.</p>\n<h2>REGION-5 Future Adult-Supported Region</h2>\n<p>v0.1 does not enable a default explicit-adult region. Any future activation requires a jurisdiction allowlist, meaningful age assurance, dedicated adult policy, consent/real-person protections, provider and payment support, and a separate capability flag.</p>\n<h2>REGION-6 Unavailable regions</h2>\n<p>We may restrict all or part of the service where prohibited by law, sanctions, app-store rules, payment restrictions or provider terms. Material regional limits should be shown before purchase where practical.</p>\n<hr />\n"},"billing":{"label":"Billing & Refunds","html":"<h1>Nyra Billing, Digital Delivery &amp; Refund Policy</h1>\n<p><strong>Document ID:</strong> BILLING<br />\n<strong>Version:</strong> 0.2.0</p>\n<blockquote>\n<p><strong>Important purchase notice.</strong> Nyra primarily sells digital access, software, digital features, virtual items and compute/API resources — not a human after-sales support package. Once a digital entitlement has been downloaded, activated, delivered or actually consumed, it is generally non-refundable except where mandatory law, store/channel rules, an express purchase-page commitment or a Nyra billing error requires otherwise. Material restrictions should be conspicuously disclosed before payment.</p>\n</blockquote>\n<h2>BILLING-1 Paid products</h2>\n<p>Nyra may offer memberships/subscriptions, Billing Credit, one-time digital features/extensions, downloadable software/content, generation quotas, virtual items and third-party-channel packages.</p>\n<p>The purchase page defines the primary scope of delivery. Human support, custom development, remote repair, long-term maintenance, guaranteed outcomes or SLA are not part of an order unless expressly listed.</p>\n<h2>BILLING-2 Billing Credit</h2>\n<p>Billing Credit represents prepaid access to digital compute/API/generation resources. It is not cash, a deposit, e-money, a security, crypto, an investment or a general monetary claim against Nyra.</p>\n<p>Credits may be consumed based on requests, tokens, calls, images, speech duration or another disclosed unit. Future packages may change if provider prices or costs change; completed orders are not retroactively repriced.</p>\n<h2>BILLING-3 When digital delivery occurs</h2>\n<p>Depending on the product, delivery may occur when a download/license/activation becomes available; a membership is activated; a digital feature is unlocked; credits are consumed; a billable model/API/generation job starts; a virtual item becomes available in inventory; or a third-party channel confirms entitlement delivery.</p>\n<p>Consumed and unconsumed portions of divisible resources may be treated separately.</p>\n<h2>BILLING-4 Generally non-refundable items</h2>\n<p>Subject to mandatory law, store/payment-channel rules and express purchase-page commitments:</p>\n<ul>\n<li>actually consumed Billing Credit is non-refundable;</li>\n<li>successfully downloaded, activated or delivered software/digital features are generally non-refundable;</li>\n<li>completed generation jobs that incurred resource cost are not refundable merely because the user dislikes the subjective output;</li>\n<li>used, gifted, consumed or irreversibly changed virtual items are generally non-refundable;</li>\n<li>once a subscription billing period has started, the current period is generally not prorated, although future renewal can be cancelled;</li>\n<li>problems caused by the user's device/network, third-party models, BYOK configuration, third-party bans/pricing, user error or unsupported environments generally do not create a Nyra refund obligation.</li>\n</ul>\n<p>AI aesthetics, personality and wording are inherently subjective. A request that was correctly executed and delivered does not become refundable solely because the output was not preferred.</p>\n<h2>BILLING-5 Narrow refund/correction cases</h2>\n<p>Nyra will address duplicate charges, clear Nyra billing errors, payment with total non-delivery, measurable credit deductions caused by a Nyra failure before billable execution, legally/store-mandated refunds and express refund promises on a purchase page.</p>\n<p>Where measurable, Nyra may first correct the issue by restoring credit, re-delivering the entitlement or another equivalent remedy unless law requires a cash refund.</p>\n<h2>BILLING-6 Downloadable software and statutory cooling-off rights</h2>\n<p>Where applicable law expressly excludes online-downloaded computer software or similar digital goods from a no-reason return right, that statutory exception applies. Other digital products/services are assessed under applicable law, product nature, pre-purchase confirmation and channel rules.</p>\n<p>Where separate confirmation is legally required to exclude a no-reason return, Nyra should obtain a conspicuous pre-payment confirmation rather than relying on hidden text or default consent.</p>\n<h2>BILLING-7 Prepayments and discontinuation</h2>\n<p>If a product legally constitutes a prepaid service, undelivered portions are handled under the purchase terms and mandatory law. Experimental status does not override mandatory rules for unused prepayments.</p>\n<p>Free/test/promotional credits may be discontinued without cash conversion. Paid but undelivered entitlements are handled under the order and applicable law.</p>\n<h2>BILLING-8 Auto-renewal</h2>\n<p>Auto-renewal must not be preselected. Price, period and cancellation method are disclosed before purchase, with renewal reminders where required. Cancelling auto-renewal does not terminate a period already paid for before its expiry.</p>\n<h2>BILLING-9 Promotional and free credits</h2>\n<p>Free, promotional, testing, developer or goodwill credits may have expiry dates and feature restrictions and may end with the relevant program. Unless mandatory law requires otherwise, they have no cash redemption value.</p>\n<h2>BILLING-10 Chargebacks and payment disputes</h2>\n<p>Report unknown charges promptly. Fraudulent chargebacks, stolen payment methods or abuse of refund systems may lead to transaction/account restrictions. Good-faith consumer disputes are not punished. Third-party API/model charges should be disputed with the third party that charged them.</p>\n<h2>BILLING-11 Support boundary</h2>\n<p>Buying a digital entitlement does not automatically purchase human after-sales support. Nyra may offer documentation, FAQ, email, community or issue-tracker support on a best-effort basis, but no fixed response time, remote-operation obligation or device-by-device resolution commitment exists unless a paid support plan expressly states one.</p>\n"},"virtual-items":{"label":"Nyra Coin & Virtual Items","html":"<h1>Nyra Virtual Items &amp; Nyra Coin Policy</h1>\n<p><strong>Document ID:</strong> VIRTUAL<br />\n<strong>Version:</strong> 0.2.0</p>\n<h2>VIRTUAL-1 What Nyra Coin is</h2>\n<p>Nyra Coin / 栖币 is an <strong>in-product gameplay accounting unit</strong> used for relationship gameplay, virtual shop items, gifts and related interaction records.</p>\n<p>Under v0.1, Nyra Coin:</p>\n<ul>\n<li>is not fiat currency;</li>\n<li>is not cryptocurrency, electronic money, a deposit, security or investment;</li>\n<li>does not promise appreciation, yield or interest;</li>\n<li>is not redeemable for cash from Nyra;</li>\n<li>does not create a debt claim against the operator;</li>\n<li>may not be used to create a real-money secondary market.</li>\n</ul>\n<h2>VIRTUAL-2 Separate from Billing Credit</h2>\n<p>Nyra Coin and Billing Credit are separate ledgers. Nyra Coin is gameplay economy; Billing Credit is prepaid access to actual digital compute/API resources. They are not mutually convertible by default.</p>\n<h2>VIRTUAL-3 Earning and spending</h2>\n<p>Nyra Coin may be granted through initial allocation, events, relationship gameplay or other in-product mechanics and used for supported virtual items, gifts or gameplay.</p>\n<p>In-product “transfer” or “payment” UI represents only an internal virtual ledger change, not a real-world financial transfer or debt.</p>\n<h2>VIRTUAL-4 Virtual items</h2>\n<p>Gifts, skins, expressions, collectibles and decorations generally grant a limited in-Nyra usage license and do not transfer underlying art, code or brand intellectual property.</p>\n<h2>VIRTUAL-5 Future changes</h2>\n<p>If Nyra later allows real-money purchase of Nyra Coin or changes it into a redeemable/prepaid instrument, this policy must be revised before launch of that feature.</p>\n<hr />\n"},"data-rights":{"label":"Data Rights & Deletion","html":"<h1>Nyra Data Rights &amp; Account Deletion</h1>\n<p><strong>Document ID:</strong> DATA<br />\n<strong>Version:</strong> 0.2.0</p>\n<h2>DATA-1 Controls</h2>\n<p>Nyra should provide reasonable controls to access account data, copy/export interactions, delete chats, manage memories and diaries, withdraw optional consent, disable model-improvement permission and delete the account.</p>\n<h2>DATA-2 Export</h2>\n<p>Interaction exports may be provided in JSON, Markdown or another common format and may include AI-origin/labeling information.</p>\n<h2>DATA-3 Deletion</h2>\n<p>Deletion should propagate through relevant active storage in a reasonable time. Backup remnants may persist through ordinary backup rotation while remaining access-restricted.</p>\n<p>Payment, fraud, security or dispute records required by law may be retained for the necessary period and may not be repurposed beyond that basis.</p>\n<h2>DATA-4 Account deletion</h2>\n<p>Use Settings → Privacy &amp; Data → Delete Account. The flow should clearly state cloud deletion, local-device cleanup, remaining paid benefits and required retention.</p>\n<h2>DATA-5 Withdrawal of consent</h2>\n<p>Where processing relies on consent, you may withdraw that consent through settings or the designated contact. Withdrawal does not invalidate processing lawfully completed before withdrawal.</p>\n<h2>DATA-6 Requests</h2>\n<p>Contact <code>privacy@memprism.com</code>. We may verify account ownership before high-risk export, deletion or account-closure requests.</p>\n<hr />\n"}}};
